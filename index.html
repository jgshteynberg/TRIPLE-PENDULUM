<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>N-Pendulum Simulation</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Attachable N-Pendulum Simulation</h1>
      <section class="controls" aria-label="Simulation controls">
        <label for="pendulum-count">Number of pendulums:</label>
        <input id="pendulum-count" type="number" min="1" max="12" value="3" />
        <button id="apply-count" type="button">Apply</button>
        <button id="reset" type="button">Reset Motion</button>
      </section>
      <p class="hint">
        Drag any bob to reposition it. Increase or decrease the count to change how many pendulums are attached.
      </p>
      <canvas id="sim-canvas" width="900" height="600"></canvas>
    </main>

    <script src="simulation.js"></script>
  </body>
</html>
